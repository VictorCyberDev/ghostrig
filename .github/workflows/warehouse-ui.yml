name: Warehouse UI build
on:
  push:
    paths:
      - "apps/web/**"
      - "packages/world-engine/**"
      - "packages/contracts/**"
      - ".github/workflows/warehouse-ui.yml"
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
